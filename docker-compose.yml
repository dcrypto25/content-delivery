# ==========================================
# TRAINERAPP.AI - Content Automation Stack
# Docker Compose Configuration
# ==========================================

version: '3.8'

services:

  # ============ N8N WORKFLOW AUTOMATION ============
  n8n:
    image: n8nio/n8n:latest
    container_name: trainerapp-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-0.0.0.0}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - EXECUTIONS_PROCESS=main
      - EXECUTIONS_MODE=regular
      - N8N_METRICS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows
      - ./storage:/app/storage
      - ./config:/app/config
    networks:
      - trainerapp-network
    depends_on:
      - postgres

  # ============ CONTENT GENERATOR ============
  content-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trainerapp-generator
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - trainerapp-network
    depends_on:
      - postgres
    command: tail -f /dev/null  # Keep container running

  # ============ POSTGRESQL DATABASE ============
  postgres:
    image: postgres:15-alpine
    container_name: trainerapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_POSTGRESDB_DATABASE:-trainerapp}
      POSTGRES_USER: ${DB_POSTGRESDB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/analytics/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - trainerapp-network

  # ============ REDIS (FOR CACHING & QUEUING) ============
  redis:
    image: redis:7-alpine
    container_name: trainerapp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - trainerapp-network

  # ============ NGINX REVERSE PROXY ============
  nginx:
    image: nginx:alpine
    container_name: trainerapp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./storage/generated:/usr/share/nginx/html/media:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - trainerapp-network
    depends_on:
      - n8n

  # ============ CERTBOT (SSL CERTIFICATES) ============
  certbot:
    image: certbot/certbot
    container_name: trainerapp-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # ============ MONITORING (OPTIONAL) ============
  # Uncomment to enable monitoring with Grafana

  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: trainerapp-prometheus
  #   restart: unless-stopped
  #   volumes:
  #     - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus
  #   ports:
  #     - "9090:9090"
  #   networks:
  #     - trainerapp-network

  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: trainerapp-grafana
  #   restart: unless-stopped
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - trainerapp-network

# ============ NETWORKS ============
networks:
  trainerapp-network:
    driver: bridge

# ============ VOLUMES ============
volumes:
  n8n_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local
  # prometheus_data:
  #   driver: local
  # grafana_data:
  #   driver: local
